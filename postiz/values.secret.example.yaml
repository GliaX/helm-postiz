# ---------------------------------------------------------------------------
# Template for the gitignored secrets overlay. Copy to postiz/values.secret.yaml
# and fill in real values. NEVER commit values.secret.yaml.
#
#   cp postiz/values.secret.example.yaml postiz/values.secret.yaml
#
# Generate the random ones:
#   openssl rand -base64 48   # JWT_SECRET
#   openssl rand -base64 32   # ENCRYPTION_KEY
#
# Rotating JWT_SECRET invalidates every Postiz session.
# Rotating ENCRYPTION_KEY means every connected social channel must be
# reconnected (tokens become unreadable).
# ---------------------------------------------------------------------------

secrets:
  # DO managed PostgreSQL. The `postiz` database + user are created once during
  # bootstrap (see README §Managed PostgreSQL). sslmode=require matches the
  # DO default (encrypted, no CA verification) — same as ERPNext's driver.
  DATABASE_URL: "postgresql://postiz:REPLACE_ME@REPLACE-ME.db.ondigitalocean.com:25061/postiz?sslmode=require"

  # In-cluster Redis (release `postiz`, bitnami subchart). The password must
  # match `redis.auth.password` below. Format: redis://:<password>@<svc>.<ns>.svc.cluster.local:6379/0
  REDIS_URL: "redis://:REPLACE_ME@postiz-redis-master.postiz.svc.cluster.local:6379/0"

  JWT_SECRET: "REPLACE_ME"
  ENCRYPTION_KEY: "REPLACE_ME"

  # Meta developer app (one app serves Facebook + Instagram FB-linked).
  # OAuth redirect URIs to register on the app (README §Meta app setup):
  #   https://postiz.glia.org/integrations/social/facebook
  #   https://postiz.glia.org/integrations/social/instagram
  #   https://postiz.glia.org/integrations/social/instagram-standalone
  FACEBOOK_APP_ID: ""
  FACEBOOK_APP_SECRET: ""

  # SMTP for invite/activation emails (uses the existing Glia mail box, same
  # login the ERPNext Email Account uses; password from k8s secret smtp-creds
  # on the erpnext side). Uncomment the matching env: block below too.
  EMAIL_PASS: ""

# --- Non-secret email config (kept together with EMAIL_PASS) -------------------
# env:
#   EMAIL_PROVIDER: "nodemailer"
#   EMAIL_HOST: "mail.emlondon.ca"
#   EMAIL_PORT: "587"
#   EMAIL_USER: "erp@glia.org"
#   EMAIL_SECURE: "false"
#   EMAIL_FROM_ADDRESS: "info@glia.org"
#   EMAIL_FROM_NAME: "Glia"

# --- In-cluster Redis auth password (keep in sync with REDIS_URL) --------------
redis:
  auth:
    password: "REPLACE_ME"
