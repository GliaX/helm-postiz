# ---------------------------------------------------------------------------
# Template for the gitignored secrets overlay. Copy to temporal/values.secret.yaml
# and fill in. NEVER commit it.
#
#   cp temporal/values.secret.example.yaml temporal/values.secret.yaml
#
# The chart renders this password into its own Secret (temporal-db-credentials
# style) and wires it to every server pod. The `temporal` DB user is created
# once during bootstrap on the DO managed PostgreSQL (README §Managed PostgreSQL).
# ---------------------------------------------------------------------------

server:
  config:
    persistence:
      datastores:
        default:
          sql:
            password: "REPLACE_ME"
        visibility:
          sql:
            password: "REPLACE_ME"
