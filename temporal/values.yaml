# ---------------------------------------------------------------------------
# Glia Temporal (for Postiz scheduled posts) — PostgreSQL-backed on the DO
# managed database. SANITIZED values; password via temporal/values.secret.yaml.
#
# Postiz >= v2.12 REQUIRES a Temporal stack for scheduled posts (the upstream
# postiz helm chart does not ship one — this release fills that gap).
#
# Deploy (see README for bootstrap prerequisites — DBs `temporal` and
# `temporal_visibility` must exist on the managed PG first):
#   helm repo add temporal https://go.temporal.io/helm-charts
#   helm repo update
#   helm -n postiz upgrade --install temporal temporal/temporal --version 1.8.0 \
#     -f temporal/values.yaml -f temporal/values.secret.yaml
#
# Postiz connects to: temporal-frontend.postiz.svc.cluster.local:7233 (namespace default)
# ---------------------------------------------------------------------------

fullnameOverride: temporal

# Chart >= 1.0.0 no longer ships datastore subcharts (cassandra/mysql/
# postgresql/elasticsearch top-level keys are REMOVED and hard-fail rendering) —
# persistence is configured purely via server.config.persistence.datastores
# below, pointed at the DO managed PostgreSQL.

server:
  replicaCount: 1
  config:
    persistence:
      defaultStore: default
      visibilityStore: visibility
      # CANNOT be changed after the initial deployment — kept small for a
      # single-instance Glia deployment (must be a power of 2).
      numHistoryShards: 4
      datastores:
        default:
          sql:
            # postgres12 (lib/pq) is the standard SQL plugin; driverName for
            # postgres12 is "postgres" (use postgres12_pgx/pgx if we ever need pgx).
            pluginName: postgres12
            driverName: postgres
            # Chart requires combined host:port (separate host/port are ignored).
            connectAddr: "REPLACE-ME.db.ondigitalocean.com:25061"
            connectProtocol: "tcp"
            databaseName: "temporal"
            user: "temporal"
            # Chart renders a Secret from this password (helm-specific field).
            password: ""  # supply via values.secret.yaml
            createDatabase: false     # DBs pre-created during bootstrap (README)
            manageSchema: true        # chart's update job applies the Temporal schemas
            # DO managed PG requires TLS. sslmode=require semantics = encrypt
            # without CA verification, so: enabled + no host verification.
            tls:
              enabled: true
              enabledHostVerification: false
        visibility:
          sql:
            pluginName: postgres12
            driverName: postgres
            connectAddr: "REPLACE-ME.db.ondigitalocean.com:25061"
            connectProtocol: "tcp"
            databaseName: "temporal_visibility"
            user: "temporal"
            password: ""  # supply via values.secret.yaml
            createDatabase: false
            manageSchema: true
            tls:
              enabled: true
              enabledHostVerification: false

# Keep the footprint minimal — debug via admintools image on demand.
admintools:
  enabled: false
web:
  enabled: false
