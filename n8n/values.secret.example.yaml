# ---------------------------------------------------------------------------
# Template for the gitignored secrets overlay. Copy to n8n/values.secret.yaml
# and fill in. NEVER commit it.
#
#   cp n8n/values.secret.example.yaml n8n/values.secret.yaml
#   openssl rand -base64 48   # encryptionKey
#
# CRITICAL: the encryptionKey encrypts every credential stored in n8n (ERPNext
# token, Postiz API key, SMTP...). Back it up — losing it makes all existing
# n8n credentials unreadable.
# ---------------------------------------------------------------------------

main:
  secret:
    n8n:
      encryption_key: "REPLACE_ME"
